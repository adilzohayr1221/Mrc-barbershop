# Codemagic CI — builds the iOS .ipa for MRC Barbershop (Capacitor)
workflows:
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "App Store Connect API key"
    environment:
      node: 22
      xcode: latest
      vars:
        APP_ID: com.mrc.barbershop
        APP_NAME: MRC Barbershop
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          app-store-connect fetch-signing-files "com.mrc.barbershop" --type IOS_APP_STORE
          ls ~/Library/MobileDevice/"Provisioning Profiles"/
      - name: Create export options
        script: |
          cat > ~/export_options.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>756WTBLYPA</string>
          </dict>
          </plist>
          PLISTEOF
          echo "Export options created:"
          cat ~/export_options.plist
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --export-options-plist ~/export_options.plist \
            --archive-flags "PROVISIONING_PROFILE=d05321b2-d80c-428e-b9a2-fa98c749ac23 CODE_SIGN_IDENTITY='iPhone Distribution' DEVELOPMENT_TEAM=756WTBLYPA"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
