# Codemagic CI — builds the iOS .ipa for MRC Barbershop (Capacitor)
workflows:
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "App Store Connect API key"
    environment:
      node: 22
      xcode: latest
      groups:
        - ios-signing
      vars:
        APP_ID: com.mrc.barbershop
        APP_NAME: MRC Barbershop
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          # Decrypt the distribution certificate and import to keychain
          openssl enc -d -aes-256-cbc -in ios/dist-final.p12.enc -out /tmp/dist.p12 -pass pass:$P12_DECRYPT_PASSWORD
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password 1234
          rm /tmp/dist.p12
          # Grant codesign access to the private key without prompts
          KEYCHAIN_PATH=$(ls ~/Library/codemagic-cli-tools/keychains/*.keychain-db 2>/dev/null | head -1)
          if [ -n "$KEYCHAIN_PATH" ]; then security set-key-partition-list -S apple-tool:,apple:,codesign: -s "$KEYCHAIN_PATH" || true; fi
          echo "Certificate installed, listing identities:"
          security find-identity -v
          # Fetch the App Store provisioning profile
          app-store-connect fetch-signing-files "com.mrc.barbershop" --type IOS_APP_STORE
          ls ~/Library/MobileDevice/"Provisioning Profiles"/
      - name: Create export options
        script: |
          cat > ~/export_options.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>756WTBLYPA</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.mrc.barbershop</key>
                  <string>MRC Barbershop App Store</string>
              </dict>
          </dict>
          </plist>
          PLISTEOF
          echo "Export options created"
      - name: Build .ipa
        script: |
          # Ensure the profile is installed (backup to fetch-signing-files)
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp assets/signing/profile.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/ 2>/dev/null || true
          ls ~/Library/MobileDevice/"Provisioning Profiles"/
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --export-options-plist ~/export_options.plist \
            --archive-flags "CODE_SIGN_IDENTITY='iPhone Distribution' DEVELOPMENT_TEAM=756WTBLYPA"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
