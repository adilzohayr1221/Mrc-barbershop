# Codemagic CI — builds the iOS .ipa for MRC Barbershop (Capacitor)
# Uses Codemagic automatic iOS code signing with the App Store Connect API key
# integration (configured at team level as "App Store Connect API key").
workflows:
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "App Store Connect API key"
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_ids:
          - com.mrc.barbershop
      vars:
        APP_ID: com.mrc.barbershop
        APP_NAME: MRC Barbershop
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
