# Codemagic CI — builds the iOS .ipa for MRC Barbershop (Capacitor)
# Code signing files (dist.p12 + profile.mobileprovision) are uploaded
# in Codemagic UI: App settings > Code signing > iOS code signing.
workflows:
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "App Store Connect API key"
    environment:
      node: 22
      xcode: latest
      vars:
        APP_ID: com.mrc.barbershop
        APP_NAME: MRC Barbershop
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          # Plan B: let Codemagic fetch (or create) the signing files automatically
          # via the App Store Connect API integration. Codemagic generates and
          # manages the private key itself — no manual .p12 password issues.
          app-store-connect fetch-signing-files com.mrc.barbershop --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          security find-identity -v -p codesigning
      - name: Generate export options
        script: |
          cat > /Users/builder/export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>756WTBLYPA</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.mrc.barbershop</key>
                  <string>MRC Barbershop App Store</string>
              </dict>
          </dict>
          </plist>
          EOF
          echo "export_options.plist written:"
          cat /Users/builder/export_options.plist
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
