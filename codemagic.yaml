# Codemagic CI — builds the iOS .ipa for MRC Barbershop (Capacitor)
workflows:
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "App Store Connect API key"
    environment:
      node: 22
      xcode: latest
      groups:
        - ios-signing
      vars:
        APP_ID: com.mrc.barbershop
        APP_NAME: MRC Barbershop
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          # Decrypt the distribution certificate and import to keychain
          openssl enc -d -aes-256-cbc -in ios/dist-final.p12.enc -out /tmp/dist.p12 -pass pass:$P12_DECRYPT_PASSWORD
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password 1234
          rm /tmp/dist.p12
          # Grant codesign access to the private key without prompts
          KEYCHAIN_PATH=$(ls ~/Library/codemagic-cli-tools/keychains/*.keychain-db 2>/dev/null | head -1)
          if [ -n "$KEYCHAIN_PATH" ]; then security set-key-partition-list -S apple-tool:,apple:,codesign: -s "$KEYCHAIN_PATH" || true; fi
          echo "Certificate installed, listing identities:"
          security find-identity -v
          # Fetch the App Store provisioning profile
          app-store-connect fetch-signing-files "com.mrc.barbershop" --type IOS_APP_STORE || true
          # Xcode 16+ reads profiles from the UserData path, not the legacy MobileDevice path.
          # Install the repo profile (UUID 79dd238e-267c-435d-b8d8-83890e193a4f) into BOTH, named by UUID.
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles" ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"
          cp assets/signing/profile.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/79dd238e-267c-435d-b8d8-83890e193a4f.mobileprovision
          cp assets/signing/profile.mobileprovision ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"/79dd238e-267c-435d-b8d8-83890e193a4f.mobileprovision
          ls ~/Library/MobileDevice/"Provisioning Profiles"/ ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"/
      - name: Create export options
        script: |
          cat > ~/export_options.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>756WTBLYPA</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.mrc.barbershop</key>
                  <string>MRC Barbershop App Store</string>
              </dict>
          </dict>
          </plist>
          PLISTEOF
          echo "Export options created"
      - name: Build .ipa
        script: |
          # Ensure the profile is installed in both locations Xcode reads (legacy + Xcode 16+ UserData)
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles" ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"
          cp assets/signing/profile.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/79dd238e-267c-435d-b8d8-83890e193a4f.mobileprovision 2>/dev/null || true
          cp assets/signing/profile.mobileprovision ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"/79dd238e-267c-435d-b8d8-83890e193a4f.mobileprovision 2>/dev/null || true
          ls ~/Library/MobileDevice/"Provisioning Profiles"/ ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"/
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --export-options-plist ~/export_options.plist \
            --archive-flags "CODE_SIGN_IDENTITY='iPhone Distribution' DEVELOPMENT_TEAM=756WTBLYPA"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-barber-release:
    name: iOS Barber Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "App Store Connect API key"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'barber-app'
          include: true
          source: true
    environment:
      node: 22
      xcode: latest
      groups:
        - ios-signing
      vars:
        APP_ID: com.mrc.barber
        APP_NAME: MRC Barber
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Barber app identity (config, icon, name, version)
        script: |
          # Own bundle identity for the barber app: barber Capacitor
          # config (appId com.mrc.barber, loads /barber-app), the final
          # MRC Barber icon (approved by the owner 2026-11-08: black
          # background, tan-gold disc #bda171, big black star + "MRC"
          # centered as one block), display name, and a fresh 1.0 (1)
          # train.
          cp capacitor.config.barber.ts capacitor.config.ts
          cp assets/barber-app/AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MRC Barber" ios/App/App/Info.plist
          sed -i '' 's/MARKETING_VERSION = 1.2;/MARKETING_VERSION = 1.0;/g; s/CURRENT_PROJECT_VERSION = 16;/CURRENT_PROJECT_VERSION = 1;/g; s/PRODUCT_BUNDLE_IDENTIFIER = com.mrc.barbershop;/PRODUCT_BUNDLE_IDENTIFIER = com.mrc.barber;/g' ios/App/App.xcodeproj/project.pbxproj
          # The Release config hardcodes PROVISIONING_PROFILE_SPECIFIER =
          # "MRC Barbershop App Store" — a profile whose App ID is
          # com.mrc.barbershop. It must never survive into a barber archive
          # (bundle/profile mismatch = xcodebuild exit 65), so strip it here;
          # `xcode-project use-profiles` in the signing step writes the
          # correct specifier for com.mrc.barber from the fetched profile.
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' ios/App/App.xcodeproj/project.pbxproj
          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|MARKETING_VERSION\|CURRENT_PROJECT_VERSION\|PROVISIONING_PROFILE_SPECIFIER" ios/App/App.xcodeproj/project.pbxproj | sort -u || true
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          # Same account distribution certificate as the customer app.
          openssl enc -d -aes-256-cbc -in ios/dist-final.p12.enc -out /tmp/dist.p12 -pass pass:$P12_DECRYPT_PASSWORD
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password 1234
          rm /tmp/dist.p12
          KEYCHAIN_PATH=$(ls ~/Library/codemagic-cli-tools/keychains/*.keychain-db 2>/dev/null | head -1)
          if [ -n "$KEYCHAIN_PATH" ]; then security set-key-partition-list -S apple-tool:,apple:,codesign: -s "$KEYCHAIN_PATH" || true; fi
          echo "Certificate installed, listing identities:"
          security find-identity -v
          # Fetch is best-effort only (same as the customer workflow): the
          # authoritative profile is the repo copy below — "MRC Barber App
          # Store" (UUID b79a9d03-37ee-43f3-91d2-74eca73048cd), created
          # manually in the Apple Developer portal on 2026-11-09 for
          # com.mrc.barber with the Push Notifications entitlement the app
          # requires (aps-environment=production) and the same distribution
          # certificate whose private key is in the .p12 above.
          app-store-connect fetch-signing-files "com.mrc.barber" --type IOS_APP_STORE || true
          # Xcode 16+ reads profiles from the UserData path, not the legacy MobileDevice path.
          # Install the repo profile into BOTH, named by UUID.
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles" ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"
          cp assets/signing/barber-profile.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/b79a9d03-37ee-43f3-91d2-74eca73048cd.mobileprovision
          cp assets/signing/barber-profile.mobileprovision ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"/b79a9d03-37ee-43f3-91d2-74eca73048cd.mobileprovision
          ls ~/Library/MobileDevice/"Provisioning Profiles"/ ~/Library/Developer/Xcode/UserData/"Provisioning Profiles"/
          # Point the project at the barber profile explicitly and
          # let use-profiles generate ~/export_options.plist from the real
          # profile assignment (bundle id -> profile name). Do NOT overwrite
          # that file afterwards: a hand-written export options plist without
          # the provisioningProfiles mapping fails the export step.
          xcode-project use-profiles --project ios/App/App.xcodeproj
          echo "Signing settings after use-profiles:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_STYLE" ios/App/App.xcodeproj/project.pbxproj | sort -u
          if grep -q "MRC Barbershop App Store" ios/App/App.xcodeproj/project.pbxproj; then
            echo "ERROR: project still references the customer app provisioning profile"
            exit 1
          fi
          if ! grep -q "MRC Barber App Store" ios/App/App.xcodeproj/project.pbxproj; then
            echo "ERROR: project does not reference the MRC Barber App Store provisioning profile after use-profiles"
            exit 1
          fi
      - name: Verify export options
        script: |
          # Generated by `xcode-project use-profiles` above; shown for the log.
          cat ~/export_options.plist
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --export-options-plist ~/export_options.plist \
            --archive-flags "CODE_SIGN_IDENTITY='iPhone Distribution' DEVELOPMENT_TEAM=756WTBLYPA"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
