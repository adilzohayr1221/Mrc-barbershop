# Codemagic CI — builds the iOS .ipa for MRC Barbershop (Capacitor)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
workflows:
  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "App Store Connect API key"
    environment:
      node: 22
      xcode: latest
      vars:
        APP_ID: com.mrc.barbershop
        APP_NAME: MRC Barbershop
      # Code signing is set up in the Codemagic UI (Teams > Integrations >
      # Apple Developer Portal) OR via the following env vars (group: appstore):
      #   APP_STORE_CONNECT_ISSUER_ID
      #   APP_STORE_CONNECT_KEY_IDENTIFIER
      #   APP_STORE_CONNECT_PRIVATE_KEY
      #   CERTIFICATE_PRIVATE_KEY  (for manual signing, if not using API key)
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch signing files (App Store Connect API)
        script: |
          app-store-connect fetch-signing-files "$APP_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing settings
        script: |
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
